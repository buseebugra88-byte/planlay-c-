<script>
const $=id=>document.getElementById(id);
const TR_DAYS=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const TR_MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const today=new Date();
const todayKey=today.toDateString();
const dateISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const ss=(k,d='')=>localStorage.getItem(k)??d;
const sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const svs=(k,v)=>localStorage.setItem(k,v);
const uid=()=>Date.now()+Math.floor(Math.random()*9999);

const APP_ICONS={
  panda:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fffaf8"/><stop offset="1" stop-color="#eef8ef"/></linearGradient></defs><rect width="128" height="128" rx="32" fill="url(#g)"/><circle cx="39" cy="37" r="18" fill="#2f3342"/><circle cx="89" cy="37" r="18" fill="#2f3342"/><circle cx="64" cy="66" r="40" fill="#fffdf9"/><ellipse cx="48" cy="61" rx="13" ry="17" fill="#2f3342"/><ellipse cx="80" cy="61" rx="13" ry="17" fill="#2f3342"/><circle cx="52" cy="57" r="5" fill="#fff"/><circle cx="84" cy="57" r="5" fill="#fff"/><circle cx="54" cy="56" r="2" fill="#7c6eb0"/><circle cx="86" cy="56" r="2" fill="#7c6eb0"/><ellipse cx="64" cy="74" rx="7" ry="5" fill="#2f3342"/><path d="M56 83 Q64 90 72 83" stroke="#2f3342" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="36" cy="76" r="7" fill="#f3b3bd" opacity=".9"/><circle cx="92" cy="76" r="7" fill="#f3b3bd" opacity=".9"/><path d="M32 89 C48 84 80 84 96 89 L94 105 C73 96 54 96 34 105Z" fill="#f7a8b8"/><path d="M76 88 C86 88 93 92 96 100 C88 100 80 98 74 92Z" fill="#e9859b"/><path d="M24 102 C36 94 48 96 58 109 C44 114 31 112 24 102Z" fill="#9ab7a3"/><path d="M104 102 C92 94 80 96 70 109 C84 114 97 112 104 102Z" fill="#9ab7a3"/><path d="M18 82 C26 73 35 73 43 82" stroke="#9ab7a3" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="25" cy="77" r="5" fill="#f7a8b8"/><circle cx="37" cy="77" r="5" fill="#f7a8b8"/><circle cx="31" cy="84" r="5" fill="#f6c65b"/><path d="M98 36 C105 27 113 33 106 41 C116 39 119 48 109 50 C105 45 101 41 98 36Z" fill="#f6c65b" opacity=".92"/><path d="M102 42 C107 43 112 45 117 50" stroke="#d46a7a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
  flower:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="#fff1f7"/><circle cx="64" cy="64" r="10" fill="#f59e0b"/><ellipse cx="64" cy="35" rx="16" ry="25" fill="#f9a8d4"/><ellipse cx="64" cy="93" rx="16" ry="25" fill="#f9a8d4"/><ellipse cx="35" cy="64" rx="25" ry="16" fill="#c4b5fd"/><ellipse cx="93" cy="64" rx="25" ry="16" fill="#c4b5fd"/><path d="M64 75 C62 92 54 103 38 112" stroke="#9ab7a3" stroke-width="7" fill="none" stroke-linecap="round"/></svg>`,
  book:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="#f2ecff"/><path d="M30 28 h40 a12 12 0 0 1 12 12 v62 H40 a10 10 0 0 0-10 10z" fill="#ffffff" stroke="#7776b9" stroke-width="5"/><path d="M82 40 a12 12 0 0 1 12-12 h4 v84 a10 10 0 0 0-10-10h-6z" fill="#fae7eb" stroke="#7776b9" stroke-width="5"/><path d="M44 49 h22 M44 65 h22 M44 81 h18" stroke="#9ab7a3" stroke-width="5" stroke-linecap="round"/></svg>`,
  star:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="#fffaf0"/><path d="M64 18 78 48 111 52 87 75 93 108 64 92 35 108 41 75 17 52 50 48Z" fill="#fbbf24" stroke="#d97706" stroke-width="5"/><circle cx="51" cy="62" r="5" fill="#2f3342"/><circle cx="77" cy="62" r="5" fill="#2f3342"/><path d="M53 76 Q64 85 75 76" stroke="#2f3342" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`,
  moon:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="#edf5ff"/><path d="M82 18 C53 28 37 55 44 82 C51 108 78 119 103 106 C74 102 55 82 59 55 C62 35 72 24 82 18Z" fill="#93c5fd"/><circle cx="42" cy="36" r="5" fill="#f9a8d4"/><circle cx="97" cy="47" r="4" fill="#fbbf24"/><circle cx="34" cy="93" r="4" fill="#c4b5fd"/></svg>`
};
function svgData(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function setIconLinks(src){document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]').forEach(l=>l.href=src)}
function applyAppIcon(key){let src='',html='';const custom=ss('customAppIcon','');if(key==='custom'&&custom){src=custom;html=`<img src="${esc(custom)}" alt="özel ikon">`}else{key=APP_ICONS[key]?key:'panda';html=APP_ICONS[key];src=svgData(html)}svs('appIcon',key);setIconLinks(src);document.querySelectorAll('.panda-logo').forEach(el=>{el.innerHTML=html});}
function pickAppIcon(key){applyAppIcon(key);renderTema()}
function handleAppIconFile(e){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{svs('customAppIcon',r.result);applyAppIcon('custom');renderTema()};r.readAsDataURL(f)}

const tabs=[['home','Ana Sayfa'],['takvim','Takvim'],['haftalik','Haftalık'],['pomodoro','Pomodoro'],['dersler','Dersler'],['sinav','Sınavlar'],['tez','Tez'],['tezodak','Tez Odak'],['hedef','Hedefler'],['habit','Alışkanlık'],['saglik','Sağlık'],['istatistik','İstatistik'],['notlar','Notlar'],['bizim','Bizim Köşemiz'],['makale','Makaleler'],['liste','İzle/Oku'],['foto','Anılar'],['muzik','Müzik'],['mood','Mood'],['journal','Günlük'],['tema','Tema']];
const TAB_EMOJI={home:'🏡',takvim:'🗓️',haftalik:'📅',pomodoro:'🍅',dersler:'📚',sinav:'📝',tez:'🎓',tezodak:'✍️',hedef:'🎯',habit:'🌿',saglik:'💧',istatistik:'📊',notlar:'🌷',bizim:'🤍',makale:'📄',liste:'🎬',foto:'🖼️',muzik:'🎧',mood:'🌿',journal:'💌',tema:'🎨'};
function tabIcon(id){return `<span class="tab-ico">${TAB_EMOJI[id]||'♡'}</span>`}


let S={
  dersler:ls('dersler',[]), sinavlar:ls('sinavlar',[]), hedef:ls('hedef',[]), makale:ls('makale',[]), liste:ls('liste',[]),
  events:ls('events',[]), journal:ls('journal',[]), mood:ls('mood',[]), foto:ls('foto',[]), tezDates:ls('tezDates',[]),
  weeklyPlans:ls('weeklyPlans',[]), healthLog:ls('healthLog',[]), healthReminders:ls('healthReminders',[]), tezFocus:ls('tezFocus',[]), quickNotes:ls('quickNotes',[]), friendMemories:ls('friendMemories',[]), friendTodos:ls('friendTodos',[]), friendGood:ls('friendGood',[]),
  habits:ls('habits',[{id:uid(),icon:'💧',name:'Su iç',days:{}},{id:uid(),icon:'📖',name:'25 dk çalışma',days:{}},{id:uid(),icon:'🌿',name:'Esneme / yürüyüş',days:{}},{id:uid(),icon:'🛌',name:'Uyku düzeni',days:{}}]),
  tezPhases:ls('tezPhases',[{name:'Literatür Taraması',pct:0},{name:'Araştırma Sorusu',pct:0},{name:'Metodoloji',pct:0},{name:'Veri Toplama',pct:0},{name:'Analiz',pct:0},{name:'Yazım',pct:0},{name:'Düzeltme',pct:0},{name:'Savunma Hazırlığı',pct:0}]),
  pomoCount:ls('pomoCount',{date:'',count:0,total:0})
};

function migrate(){
  ['dersler','sinavlar','hedef','habits','makale','liste','events','journal','mood','foto','tezDates','tezPhases','weeklyPlans','healthLog','healthReminders','tezFocus','quickNotes','friendMemories','friendTodos','friendGood'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
  S.dersler.forEach(x=>{x.id=x.id||uid();x.name=x.name||x.title||'Adsız ders';x.note=x.note||'';x.done=!!x.done});
  S.sinavlar.forEach(x=>{x.id=x.id||uid();x.name=x.name||x.title||'Adsız';x.type=x.type||'sınav';x.date=x.date||'';x.done=!!x.done});
  S.hedef.forEach(x=>{x.id=x.id||uid();x.name=x.name||x.title||'Adsız hedef';x.steps=Math.max(1,Math.min(7,parseInt(x.steps||x.days||5)));if(!Array.isArray(x.done))x.done=new Array(x.steps).fill(!!x.done);while(x.done.length<x.steps)x.done.push(false);if(x.done.length>x.steps)x.done=x.done.slice(0,x.steps)});
  S.makale.forEach(x=>{x.id=x.id||uid();x.name=x.name||x.title||'Adsız makale';x.url=x.url||'';x.note=x.note||'';x.done=!!(x.done||x.read)});
  S.liste.forEach(x=>{x.id=x.id||uid();x.name=x.name||x.title||'Adsız';x.type=x.type||'kitap';x.done=!!x.done});
  S.events.forEach(x=>{x.id=x.id||uid();x.name=x.name||x.title||'Etkinlik';x.date=x.date||dateISO(today)});
  S.tezDates.forEach(x=>{x.id=x.id||uid();x.name=x.name||x.title||'Tez tarihi';x.date=x.date||''});
  S.habits.forEach(x=>{x.id=x.id||uid();x.icon=x.icon||'🐼';x.name=x.name||x.title||'Alışkanlık';if(!x.days||typeof x.days!=='object')x.days={}});
  S.journal.forEach(x=>{x.id=x.id||uid();x.date=x.date||dateISO(today);x.text=x.text||''});
  S.mood.forEach(x=>{x.id=x.id||uid();x.date=x.date||todayKey;x.val=Number(x.val||3)});
  S.foto.forEach(x=>{x.id=x.id||uid();x.data=x.data||x.src||'';x.note=x.note||'♡'});
  S.weeklyPlans.forEach(x=>{x.id=x.id||uid();x.day=Number(x.day||0);x.text=x.text||x.name||'Plan';x.type=x.type||'Ders';x.done=!!x.done});
  S.healthLog.forEach(x=>{x.id=x.id||uid();x.date=x.date||dateISO(today);x.water=Number(x.water||0);x.walk=Number(x.walk||0);x.sleep=x.sleep||'';x.note=x.note||''});
  S.healthReminders.forEach(x=>{x.id=x.id||uid();x.name=x.name||'Hatırlatıcı';x.time=x.time||'';if(!x.done||typeof x.done!=='object')x.done={}});
  S.tezFocus.forEach(x=>{x.id=x.id||uid();x.date=x.date||dateISO(today);x.words=Number(x.words||0);x.articles=Number(x.articles||0);x.note=x.note||'';x.actions=x.actions||''});
  S.quickNotes.forEach(x=>{x.id=x.id||uid();x.text=x.text||'';x.color=x.color||'lav';x.pin=!!x.pin;x.date=x.date||dateISO(today)});
  S.friendMemories.forEach(x=>{x.id=x.id||uid();x.date=x.date||dateISO(today);x.title=x.title||'Küçük anı';x.text=x.text||'';x.mood=x.mood||'🌸'});
  S.friendTodos.forEach(x=>{x.id=x.id||uid();x.text=x.text||'Birlikte yapılacak';x.done=!!x.done});
  S.friendGood.forEach(x=>{x.id=x.id||uid();x.text=x.text||'';x.date=x.date||dateISO(today)});
  Object.keys(S).forEach(k=>{if(k!=='pomoCount')sv(k,S[k])});sv('pomoCount',S.pomoCount);
}
migrate();

function init(){
  $('nav').innerHTML=tabs.map(([id,label])=>`<button class="tab ${id==='home'?'active':''}" onclick="go('${id}',this)">${tabIcon(id)}<span>${label}</span></button>`).join('');
  $('todayChip').textContent=`${TR_DAYS[today.getDay()]}, ${today.getDate()} ${TR_MONTHS[today.getMonth()]}`;
  const b=new Date(today.getFullYear(),4,27); if(b<today)b.setFullYear(today.getFullYear()+1); const left=Math.ceil((b-today)/864e5); $('birthChip').textContent=left===0?'🎂 Bugün doğum günü!':`🎂 ${left} gün kaldı!`;
  {if(ss('themeUserPicked','')!=='1' && (ss('theme','')==='' || ss('theme','')==='panda' || ss('theme','')==='lavender')) svs('theme','floral'); const th=ss('theme','floral'); applyTheme(th==='lavender'?'floral':th)}; applyFS(parseInt(ss('fs','1'))||1); applyAppIcon(ss('appIcon','flower'));
  renderAll();
}
function go(id,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));$('page-'+id).classList.add('active');(btn||document.querySelector(`.tab[onclick*="${id}"]`)).classList.add('active');}
function saveAll(){Object.keys(S).forEach(k=>{if(k!=='pomoCount')sv(k,S[k])});sv('pomoCount',S.pomoCount);}
function renderAll(){renderHome();renderCal();renderWeekly();renderPomo();renderDers();renderSinav();renderTez();renderTezFocus();renderHedef();renderHabit();renderHealth();renderStats();renderNotes();renderBizim();renderMakale();renderListe();renderFoto();renderMuzik();renderMood();renderJournal();renderTema();}
function title(icon,text,sub=''){return `<div class="title"><span class="title-ico">${icon}</span><span>${text}</span></div>${sub?`<div class="subtitle">${sub}</div>`:''}`}

function calcTez(){return S.tezPhases.length?Math.round(S.tezPhases.reduce((a,p)=>a+(Number(p.pct)||0),0)/S.tezPhases.length):0}
function dleft(dt){if(!dt)return null;const a=new Date(dt+'T12:00'),b=new Date(dateISO(today)+'T12:00');return Math.ceil((a-b)/864e5)}
function dueTag(dt){const d=dleft(dt);if(d===null)return '';if(d<0)return '<span class="tag urgent">geçti</span>';if(d===0)return '<span class="tag urgent">bugün</span>';if(d<=3)return `<span class="tag urgent">${d} gün</span>`;if(d<=7)return `<span class="tag soon">${d} gün</span>`;return `<span class="tag oktag">${d} gün</span>`}
function activeCount(arr){return arr.filter(x=>!x.done).length}

const WEEK_DAYS=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
function currentHealth(){const d=dateISO(today);let h=S.healthLog.find(x=>x.date===d);if(!h){h={id:uid(),date:d,water:0,walk:0,sleep:'',note:''};S.healthLog.push(h)}return h}
function getTezToday(){const d=dateISO(today);let x=S.tezFocus.find(t=>t.date===d);if(!x){x={id:uid(),date:d,words:0,articles:0,note:'',actions:''};S.tezFocus.push(x)}return x}
function doneWeekly(){return S.weeklyPlans.filter(x=>x.done).length}
function doneHabitsToday(){const k=dateISO(today);return S.habits.filter(h=>h.days&&h.days[k]).length}


function renderHome(){
 const p=$('page-home');const mood=S.mood.find(m=>m.date===todayKey);const emojis=['','😞','😔','😐','🙂','😄'];
 const doneH=S.hedef.filter(h=>h.done.every(Boolean)).length;
 const hTotal=S.habits.length||0, hDone=S.habits.filter(h=>h.days&&h.days[dateISO(today)]).length, hPct=hTotal?Math.round(hDone*100/hTotal):0;
 p.innerHTML=`
  <div class="card hero"><small>🐼 ${TR_DAYS[today.getDay()]} motivasyonu</small><div class="quote">“Küçük adımlar büyük yolculukların en sessiz ama en güçlü başlangıcıdır.”</div><div class="it-sub" style="margin-top:10px">Bugün bir görev, bir not, bir küçük ilerleme yeter.</div></div>
  <div class="panda-board">
    <div class="panda-panel"><div class="ct">Bugünkü plan</div><div class="big">${hDone}/${hTotal} alışkanlık tamamlandı</div><div class="panda-meter"><span style="width:${hPct}%"></span></div><div class="it-sub" style="margin-top:10px">Su, çalışma, hareket ve küçük rutinler tek yerde.</div><button class="btn ghost" style="margin-top:12px" onclick="go('habit')">🌿 Alışkanlıklara git</button></div>
    <div class="panda-panel"><div class="ct">Mini özet</div><div class="soft-wave"></div><div class="it-sub" style="margin-top:10px">Mood: ${mood?emojis[mood.val]:'—'} • Tez: ${calcTez()}% • Su: ${currentHealth().water}/8 • Not: ${S.quickNotes.length}</div></div>
  </div>
  <div class="grid2 stats"><div class="box"><div class="statnum">${activeCount(S.dersler)}</div><div class="statlbl">aktif ders</div></div><div class="box"><div class="statnum">${activeCount(S.sinavlar)}</div><div class="statlbl">bekleyen sınav/ödev</div></div><div class="box"><div class="statnum">${calcTez()}%</div><div class="statlbl">tez ilerlemesi</div></div><div class="box"><div class="statnum">${S.pomoCount.date===todayKey?S.pomoCount.count:0}</div><div class="statlbl">bugünkü pomodoro</div></div></div>
  <div class="card soft"><div class="ct">Hızlı erişim</div><div class="grid2"><button class="btn ghost quick" onclick="go('haftalik')">🗓 Haftalık plan</button><button class="btn ghost quick" onclick="go('saglik')">💧 Sağlık</button><button class="btn ghost quick" onclick="go('tezodak')">✍️ Tez odak</button><button class="btn ghost quick" onclick="go('notlar')">📝 Hızlı not</button><button class="btn ghost quick" onclick="go('istatistik')">📊 İstatistik</button><button class="btn ghost quick" onclick="go('takvim')">📆 Takvim</button></div></div>
  <div class="card"><div class="ct">Genel arama</div><div class="row"><input class="inp" id="globalSearch" placeholder="ders, sınav, makale, hedef, etkinlik ara..." oninput="doSearch(this.value)"><button class="btn ghost" onclick="$('globalSearch').value='';doSearch('')">Temizle</button></div><div id="searchResults" class="search-results"></div></div>`;
}
function doSearch(q){const el=$('searchResults');if(!el)return;q=q.trim().toLowerCase();if(!q){el.innerHTML='';return}const all=[];const add=(type,name,sub)=>{if(String(name+' '+sub).toLowerCase().includes(q))all.push({type,name,sub})};

let calY=today.getFullYear(), calM=today.getMonth();
function calNav(n){calM+=n;if(calM>11){calM=0;calY++}if(calM<0){calM=11;calY--}renderCal()}
function renderCal(){const p=$('page-takvim');p.innerHTML=title('📆','Takvim','Etkinliklerin burada görünür. Etkinlikleri düzenleyebilir veya silebilirsin.')+`<div class="card"><div class="cal-nav"><button class="cal-btn" onclick="calNav(-1)">‹</button><div class="cal-title">${TR_MONTHS[calM]} ${calY}</div><button class="cal-btn" onclick="calNav(1)">›</button></div><div class="cal-grid" id="calGrid"></div></div><div class="card soft"><div class="ct">Bu aydaki etkinlikler</div><div id="monthEvents"></div></div><div class="card"><div class="ct">Etkinlik ekle</div><div class="row"><input type="date" id="evDate" class="inp"><input id="evName" class="inp" placeholder="sınav, teslim, randevu..."><button class="btn" onclick="addEvent()">+ Ekle</button></div></div>`;drawCal();}
function drawCal(){const heads=['Pt','Sa','Ça','Pe','Cu','Ct','Pz'];let html=heads.map(h=>`<div class="cal-head">${h}</div>`).join('');const fd=new Date(calY,calM,1).getDay(),off=(fd+6)%7,dim=new Date(calY,calM+1,0).getDate();for(let i=0;i<off;i++)html+='<div></div>';for(let d=1;d<=dim;d++){const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const has=S.events.some(e=>e.date===ds)||S.sinavlar.some(e=>e.date===ds)||S.tezDates.some(e=>e.date===ds);const isT=d===today.getDate()&&calM===today.getMonth()&&calY===today.getFullYear();const isB=calM===4&&d===27;html+=`<div class="day ${isT?'today':isB?'bday':has?'has':''}">${isB?'🎂':d}${has?'<span class="dot"></span>':''}</div>`}$('calGrid').innerHTML=html;renderMonthEvents()}
function renderMonthEvents(){const all=[...S.events.map(e=>({...e,kind:'📌'})),...S.sinavlar.filter(e=>e.date).map(e=>({id:e.id,date:e.date,name:e.name,kind:e.type==='ödev'?'📋':'📝',source:'sinav'})),...S.tezDates.filter(e=>e.date).map(e=>({id:e.id,date:e.date,name:e.name,kind:'🎓',source:'tez'}))].filter(e=>{const d=new Date(e.date+'T12:00');return d.getMonth()===calM&&d.getFullYear()===calY}).sort((a,b)=>new Date(a.date)-new Date(b.date));const el=$('monthEvents');if(!all.length){el.innerHTML='<div class="empty">bu ayda etkinlik yok</div>';return}el.innerHTML=all.map(e=>`<div class="item event-item"><div class="it-main"><div class="date-mini">${new Date(e.date+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}</div><div class="it-title">${e.kind} ${esc(e.name)}</div><div class="it-sub">${e.source==='sinav'?'Sınav/ödev bölümünden geliyor':e.source==='tez'?'Tez tarihlerinden geliyor':'Takvim etkinliği'}</div></div><div class="actions">${!e.source?`<button class="btn small ghost" onclick="editEvent(${e.id})">✎ Düzenle</button><button class="btn small bad" onclick="delEvent(${e.id})">🗑 Sil</button>`:''}</div></div>`).join('')}
function addEvent(){const d=$('evDate').value,n=$('evName').value.trim();if(!d||!n){alert('Tarih ve etkinlik adı gir.');return}S.events.push({id:uid(),date:d,name:n});sv('events',S.events);renderCal();renderHome()}
function editEvent(id){const e=S.events.find(x=>x.id===id);if(!e)return;const n=prompt('Etkinlik adını düzenle:',e.name);if(n===null)return;const d=prompt('Tarihi düzenle (YYYY-AA-GG):',e.date);if(d===null)return;e.name=n.trim()||e.name;e.date=d.trim()||e.date;sv('events',S.events);renderCal();renderHome()}
function delEvent(id){if(!confirm('Bu etkinlik silinsin mi?'))return;S.events=S.events.filter(x=>x.id!==id);sv('events',S.events);renderCal();renderHome()}

let pomoMode='work',pomoSec=1500,pomoTotal=1500,pomoTimer=null;
function renderPomo(){const p=$('page-pomodoro');p.innerHTML=title('⏱','Pomodoro')+`<div class="card soft center"><div class="actions" style="justify-content:center"><button class="btn small ghost" onclick="setPomo('work')">🍅 Çalışma 25</button><button class="btn small ghost" onclick="setPomo('short')">🌿 Mola 5</button><button class="btn small ghost" onclick="setPomo('long')">☕ Uzun 15</button></div><div class="pomo-ring"><div><div class="pomo-time" id="pomoTime">25:00</div><div class="pomo-label" id="pomoLbl">Çalışma zamanı</div></div></div><div class="actions" style="justify-content:center"><button class="btn" onclick="togglePomo()" id="pomoToggle">▶ Başlat</button><button class="btn ghost" onclick="resetPomo()">↺ Sıfırla</button></div></div><div class="grid2 stats"><div class="box"><div class="statnum" id="pomoToday">0</div><div class="statlbl">bugün</div></div><div class="box"><div class="statnum" id="pomoAll">0</div><div class="statlbl">toplam</div></div></div><div class="card"><div class="ct">Ne üzerinde çalışıyorum?</div><input class="inp" id="pomoTask" placeholder="örn: tez literatür taraması..." value="${esc(ss('pomoTask',''))}" oninput="svs('pomoTask',this.value)"></div>`;updatePomoUI()}
function setPomo(m){pomoMode=m;pomoTotal=m==='work'?1500:m==='short'?300:900;pomoSec=pomoTotal;clearInterval(pomoTimer);pomoTimer=null;updatePomoUI()}
function fmt(sec){return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function updatePomoUI(){if($('pomoTime'))$('pomoTime').textContent=fmt(pomoSec);if($('pomoLbl'))$('pomoLbl').textContent=pomoMode==='work'?'Çalışma zamanı':'Mola zamanı';if($('pomoToggle'))$('pomoToggle').textContent=pomoTimer?'⏸ Duraklat':'▶ Başlat';if(S.pomoCount.date!==todayKey){S.pomoCount.date=todayKey;S.pomoCount.count=0;sv('pomoCount',S.pomoCount)}if($('pomoToday'))$('pomoToday').textContent=S.pomoCount.count||0;if($('pomoAll'))$('pomoAll').textContent=S.pomoCount.total||0}
function togglePomo(){if(pomoTimer){clearInterval(pomoTimer);pomoTimer=null;updatePomoUI();return}pomoTimer=setInterval(()=>{pomoSec--;if(pomoSec<=0){clearInterval(pomoTimer);pomoTimer=null;if(pomoMode==='work'){if(S.pomoCount.date!==todayKey){S.pomoCount.date=todayKey;S.pomoCount.count=0}S.pomoCount.count=(S.pomoCount.count||0)+1;S.pomoCount.total=(S.pomoCount.total||0)+1;sv('pomoCount',S.pomoCount);notify('Pomodoro bitti 🌸','Şimdi 5 dakika mola iyi gelir.');}resetPomo();renderHome()}else updatePomoUI()},1000);updatePomoUI()}
function resetPomo(){clearInterval(pomoTimer);pomoTimer=null;pomoSec=pomoTotal;updatePomoUI()}

function splitDone(arr){return [arr.filter(x=>!x.done),arr.filter(x=>x.done)]}
function listItem(x,type){const sub={ders:`${x.note||''}`,sinav:`${x.type||''} ${x.date?new Date(x.date+'T12:00').toLocaleDateString('tr-TR'):''}`,makale:`${x.note||''}`,liste:`${x.type||''}`}[type]||'';return `<div class="item ${x.done?'done':''}"><button class="check ${x.done?'on':''}" onclick="toggleSimple('${type}',${x.id})">✓</button><div class="it-main"><div class="it-title">${type==='sinav'?(x.type==='ödev'?'📋':'📝'):type==='makale'?'📰':type==='liste'?'🎬':'📚'} ${esc(x.name)} ${type==='sinav'?dueTag(x.date):''}</div>${sub?`<div class="it-sub">${esc(sub)}${type==='makale'&&x.url?` • <a href="${esc(x.url)}" target="_blank">link</a>`:''}</div>`:''}</div><div class="actions"><button class="btn small ghost" onclick="editSimple('${type}',${x.id})">✎</button><button class="btn small bad" onclick="deleteSimple('${type}',${x.id})">🗑</button></div></div>`}
function archiveBlock(title,items,type){return `<details class="archive"><summary>${title} (${items.length})</summary><div class="archive-body">${items.length?items.map(x=>listItem(x,type)).join(''):'<div class="empty">arşiv boş</div>'}</div></details>`}
function toggleSimple(type,id){const map={ders:'dersler',sinav:'sinavlar',makale:'makale',liste:'liste'};const arr=S[map[type]];const x=arr.find(a=>a.id===id);if(x){x.done=!x.done;sv(map[type],arr);renderAll()}}
function editSimple(type,id){const map={ders:'dersler',sinav:'sinavlar',makale:'makale',liste:'liste'};const arr=S[map[type]],x=arr.find(a=>a.id===id);if(!x)return;const n=prompt('Adı düzenle:',x.name);if(n===null)return;x.name=n.trim()||x.name;if(type==='sinav'){const d=prompt('Tarih (YYYY-AA-GG):',x.date||'');if(d!==null)x.date=d.trim()}if(type==='ders'||type==='makale'){const note=prompt('Not:',x.note||'');if(note!==null)x.note=note.trim()}if(type==='makale'){const url=prompt('Link/DOI:',x.url||'');if(url!==null)x.url=url.trim()}sv(map[type],arr);renderAll()}

function renderNotes(){const sorted=S.quickNotes.slice().sort((a,b)=>(b.pin-a.pin)||b.date.localeCompare(a.date)||b.id-a.id);$('page-notlar').innerHTML=title('📝','Hızlı Notlar','Yapışkan not gibi hızlı fikirleri kaydet.')+`<div class="card soft"><div class="ct">Yeni not</div><textarea id="noteText" placeholder="aklına geleni yaz..."></textarea><div class="row" style="margin-top:9px"><select class="inp" id="noteColor"><option value="lav">Lavanta</option><option value="pink">Pembe</option><option value="mint">Mint</option><option value="sky">Mavi</option></select><button class="btn" onclick="addQuickNote()">+ Not ekle</button></div></div><div class="card"><div class="ct">Notlarım (${S.quickNotes.length})</div><div class="note-grid">${sorted.map(noteCard).join('')}</div>${!S.quickNotes.length?'<div class="empty">henüz not yok</div>':''}</div>`}
function noteCard(n){return `<div class="note-card ${esc(n.color)}"><div class="note-actions"><button class="btn small ghost" onclick="pinNote(${n.id})">${n.pin?'★':'☆'}</button><button class="btn small ghost" onclick="editNote(${n.id})">✎</button><button class="btn small bad" onclick="delNote(${n.id})">🗑</button></div><div class="note-date">${n.pin?'★ sabit • ':''}${esc(n.date)}</div>${esc(n.text)}</div>`}
function addQuickNote(){const text=$('noteText').value.trim();if(!text)return;S.quickNotes.push({id:uid(),text,color:$('noteColor').value,pin:false,date:dateISO(today)});sv('quickNotes',S.quickNotes);renderNotes();renderHome();}
function editNote(id){const n=S.quickNotes.find(x=>x.id===id);if(!n)return;const text=prompt('Not:',n.text);if(text===null)return;n.text=text.trim()||n.text;sv('quickNotes',S.quickNotes);renderNotes();}
function pinNote(id){const n=S.quickNotes.find(x=>x.id===id);if(!n)return;n.pin=!n.pin;sv('quickNotes',S.quickNotes);renderNotes();}
function delNote(id){if(!confirm('Bu not silinsin mi?'))return;S.quickNotes=S.quickNotes.filter(x=>x.id!==id);sv('quickNotes',S.quickNotes);renderNotes();renderHome();}

    <div class="card"><div class="ct">Anı ekle</div><div class="row"><input class="inp" id="fmDate" type="date" value="${dateISO(today)}"><input class="inp" id="fmMood" maxlength="3" value="🌸" style="flex:0 0 72px"></div><input class="inp" id="fmTitle" placeholder="anı başlığı..." style="margin-bottom:9px"><textarea id="fmText" placeholder="o günü, iç şakayı veya küçük detayı yaz..."></textarea><button class="btn" style="margin-top:9px" onclick="addFriendMemory()">+ Anıya ekle</button></div>
    <div class="card"><div class="ct">Birlikte yapılacak ekle</div><div class="row"><input class="inp" id="ftText" placeholder="örn: kahve içilecek yer, film, yürüyüş..."><button class="btn" onclick="addFriendTodo()">+ Ekle</button></div><div class="ct" style="margin-top:14px">İyi ki notu</div><div class="row"><input class="inp" id="fgText" placeholder="İyi ki ..."><button class="btn" onclick="addFriendGood()">+ Ekle</button></div></div>
  </div>
  <div class="grid2">
    <div class="card"><div class="ct">Anı Kavanozu</div>${memories.length?memories.map(x=>`<div class="item"><div class="habit-emoji">${esc(x.mood)}</div><div class="it-main"><div class="it-title">${esc(x.title)}</div><div class="it-sub">${esc(x.date)}${x.text?' • '+esc(x.text):''}</div></div><div class="actions"><button class="btn small ghost" onclick="editFriendMemory(${x.id})">✎</button><button class="btn small bad" onclick="delFriend('friendMemories',${x.id})">Sil</button></div></div>`).join(''):'<div class="empty">henüz anı yok</div>'}</div>
    <div class="card"><div class="ct">Birlikte Yapılacaklar</div>${todos.length?todos.map(x=>`<div class="item ${x.done?'done':''}"><button class="check ${x.done?'done':''}" onclick="toggleFriendTodo(${x.id})"></button><div class="it-main"><div class="it-title">${esc(x.text)}</div><div class="it-sub">${x.done?'Yapıldı arşivinde':'Bekliyor'}</div></div><div class="actions"><button class="btn small ghost" onclick="editFriendTodo(${x.id})">✎</button><button class="btn small bad" onclick="delFriend('friendTodos',${x.id})">Sil</button></div></div>`).join(''):'<div class="empty">henüz plan yok</div>'}</div>
  </div>
  <div class="card soft"><div class="ct">İyi ki Listesi</div>${good.length?good.map(x=>`<div class="item"><div class="habit-emoji">🤍</div><div class="it-main"><div class="it-title">${esc(x.text)}</div><div class="it-sub">${esc(x.date)}</div></div><div class="actions"><button class="btn small ghost" onclick="editFriendGood(${x.id})">✎</button><button class="btn small bad" onclick="delFriend('friendGood',${x.id})">Sil</button></div></div>`).join(''):'<div class="empty">henüz iyi ki notu yok</div>'}</div>`;
}
function addFriendMemory(){const title=$('fmTitle').value.trim();const text=$('fmText').value.trim();if(!title&&!text)return;S.friendMemories.push({id:uid(),date:$('fmDate').value||dateISO(today),mood:$('fmMood').value.trim()||'🌸',title:title||'Küçük anı',text});sv('friendMemories',S.friendMemories);renderAll()}
function editFriendMemory(id){const x=S.friendMemories.find(a=>a.id===id);if(!x)return;const t=prompt('Anı başlığı:',x.title);if(t===null)return;const d=prompt('Tarih:',x.date);if(d===null)return;const m=prompt('Emoji:',x.mood);if(m===null)return;const tx=prompt('Not:',x.text);if(tx===null)return;x.title=t.trim()||x.title;x.date=d.trim()||x.date;x.mood=m.trim()||x.mood;x.text=tx.trim();sv('friendMemories',S.friendMemories);renderAll()}
function addFriendTodo(){const text=$('ftText').value.trim();if(!text)return;S.friendTodos.push({id:uid(),text,done:false});sv('friendTodos',S.friendTodos);renderAll()}
function toggleFriendTodo(id){const x=S.friendTodos.find(a=>a.id===id);if(x){x.done=!x.done;sv('friendTodos',S.friendTodos);renderAll()}}
function editFriendTodo(id){const x=S.friendTodos.find(a=>a.id===id);if(!x)return;const t=prompt('Birlikte yapılacak:',x.text);if(t===null)return;x.text=t.trim()||x.text;sv('friendTodos',S.friendTodos);renderAll()}
function addFriendGood(){let text=$('fgText').value.trim();if(!text)return;if(!/^iyi ki/i.test(text))text='İyi ki '+text;S.friendGood.push({id:uid(),date:dateISO(today),text});sv('friendGood',S.friendGood);renderAll()}
function editFriendGood(id){const x=S.friendGood.find(a=>a.id===id);if(!x)return;const t=prompt('İyi ki notu:',x.text);if(t===null)return;x.text=t.trim()||x.text;sv('friendGood',S.friendGood);renderAll()}
function delFriend(key,id){if(!confirm('Bu kayıt tamamen silinsin mi?'))return;S[key]=S[key].filter(x=>x.id!==id);sv(key,S[key]);renderAll()}

function renderMakale(){const [a,d]=splitDone(S.makale);$('page-makale').innerHTML=title('📰','Makale Listem','Okundu işaretlenenler arşivde kalır.')+`<div class="card soft"><div class="ct">Makale ekle</div><div class="row"><input class="inp" id="mName" placeholder="makale başlığı..."><button class="btn" onclick="addMakale()">+ Ekle</button></div><input class="inp" id="mUrl" placeholder="doi veya link..." style="margin-bottom:9px"><input class="inp" id="mNote" placeholder="not..."></div><div class="card"><div class="ct">Okunacaklar (${a.length})</div>${a.map(x=>listItem(x,'makale')).join('')||'<div class="empty">okunacak makale yok</div>'}${archiveBlock('Okundu arşivi',d,'makale')}</div>`}
function addMakale(){const n=$('mName').value.trim();if(!n)return;S.makale.push({id:uid(),name:n,url:$('mUrl').value.trim(),note:$('mNote').value.trim(),done:false});sv('makale',S.makale);renderMakale();renderHome()}
function renderListe(){const [a,d]=splitDone(S.liste);$('page-liste').innerHTML=title('🎬','İzle / Oku / Dinle','Tamamlananlar arşivde kalır.')+`<div class="card soft"><div class="ct">Ekle</div><div class="row"><input class="inp" id="lName" placeholder="kitap / film / dizi..."><select class="inp" id="lType"><option value="kitap">📚 Kitap</option><option value="film">🎬 Film</option><option value="dizi">📺 Dizi</option><option value="albüm">🎵 Albüm</option></select><button class="btn" onclick="addListe()">+ Ekle</button></div></div><div class="card"><div class="ct">Listem (${a.length})</div><div class="media-grid">${a.map(x=>mediaItem(x)).join('')}</div>${!a.length?'<div class="empty">liste boş</div>':''}${archiveBlock('Tamamlanan izleme/okuma arşivi',d,'liste')}</div>`}
function mediaItem(x){return `<div class="media ${x.done?'done':''}" onclick="toggleSimple('liste',${x.id})"><button class="btn small bad mx" onclick="event.stopPropagation();deleteSimple('liste',${x.id})">🗑</button><div class="mtype">${esc(x.type)}</div><div class="mt">${esc(x.name)}</div></div>`}
function addListe(){const n=$('lName').value.trim();if(!n)return;S.liste.push({id:uid(),name:n,type:$('lType').value,done:false});sv('liste',S.liste);renderListe();renderHome()}

function hDone(h){return h.done.every(Boolean)}
function renderHedef(){const active=S.hedef.filter(h=>!hDone(h)),done=S.hedef.filter(h=>hDone(h));$('page-hedef').innerHTML=title('🎯','Haftalık Hedefler','Tamamlanınca üstü çizilir ve arşivde kalır.')+`<div class="card soft"><div class="ct">Yeni hedef</div><div class="row"><input class="inp" id="hName" placeholder="hedef..."><input class="inp" id="hDays" type="number" min="1" max="7" placeholder="gün" value="5" style="max-width:120px"><button class="btn" onclick="addHedef()">+ Ekle</button></div></div><div class="card"><div class="ct">Aktif hedefler (${active.length})</div>${active.map(h=>goalItem(h)).join('')||'<div class="empty">aktif hedef yok</div>'}<details class="archive"><summary>Tamamlanan hedefler arşivi (${done.length})</summary><div class="archive-body">${done.map(h=>goalItem(h)).join('')||'<div class="empty">arşiv boş</div>'}</div></details></div>`}
function goalItem(h){const c=h.done.filter(Boolean).length,p=Math.round(c/h.steps*100);return `<div class="item ${hDone(h)?'done':''}"><button class="check ${hDone(h)?'on':''}" onclick="toggleGoalAll(${h.id})">✓</button><div class="it-main"><div class="it-title">${esc(h.name)} <span class="tag">${p}%</span></div><div class="prog"><div class="bar" style="width:${p}%"></div></div><div class="steps">${h.done.map((v,i)=>`<button class="step ${v?'on':''}" onclick="toggleGoal(${h.id},${i})">${i+1}</button>`).join('')}</div></div><div class="actions"><button class="btn small ghost" onclick="editGoal(${h.id})">✎</button><button class="btn small bad" onclick="delGoal(${h.id})">🗑</button></div></div>`}
function addHedef(){const n=$('hName').value.trim();if(!n)return;const s=Math.max(1,Math.min(7,parseInt($('hDays').value)||5));S.hedef.push({id:uid(),name:n,steps:s,done:new Array(s).fill(false)});sv('hedef',S.hedef);renderHedef();renderHome()}
function toggleGoal(id,i){const h=S.hedef.find(x=>x.id===id);if(h){h.done[i]=!h.done[i];sv('hedef',S.hedef);renderHedef();renderHome()}}
function toggleGoalAll(id){const h=S.hedef.find(x=>x.id===id);if(h){const val=!hDone(h);h.done=h.done.map(()=>val);sv('hedef',S.hedef);renderHedef();renderHome()}}
function editGoal(id){const h=S.hedef.find(x=>x.id===id);if(!h)return;const n=prompt('Hedef adı:',h.name);if(n===null)return;h.name=n.trim()||h.name;sv('hedef',S.hedef);renderHedef()}
function delGoal(id){if(!confirm('Bu hedef tamamen silinsin mi?'))return;S.hedef=S.hedef.filter(x=>x.id!==id);sv('hedef',S.hedef);renderHedef();renderHome()}

function renderHabit(){const key=dateISO(today);const total=S.habits.length,done=S.habits.filter(h=>h.days&&h.days[key]).length,pct=total?Math.round(done*100/total):0;$('page-habit').innerHTML=title('🐼','Alışkanlık Takibi','Günlük küçük rutinleri işaretle; her gün ayrı kaydedilir.')+`<div class="card soft"><div class="ct">Bugünün ilerlemesi</div><div class="statnum">${done}/${total}</div><div class="statlbl">tamamlanan alışkanlık</div><div class="panda-meter"><span style="width:${pct}%"></span></div></div><div class="card"><div class="ct">Yeni alışkanlık ekle</div><div class="row"><input class="inp" id="habitIcon" placeholder="ikon" maxlength="3" value="🌿" style="flex:0 0 86px"><input class="inp" id="habitName" placeholder="örn: 30 dk yürüyüş"><button class="btn" onclick="addHabit()">+ Ekle</button></div></div><div class="card"><div class="ct">Bugünkü alışkanlıklar</div>${S.habits.length?S.habits.map(h=>habitItem(h,key)).join(''):'<div class="empty">henüz alışkanlık yok</div>'}</div>`}
function habitItem(h,key){const ok=!!(h.days&&h.days[key]);return `<div class="habit-tile ${ok?'done':''}"><button class="check ${ok?'on':''}" onclick="toggleHabit(${h.id})">✓</button><div class="habit-emoji">${esc(h.icon||'🐼')}</div><div class="habit-name">${esc(h.name)}</div><div class="habit-actions"><button class="btn small ghost" onclick="editHabit(${h.id})">✎</button><button class="btn small bad" onclick="delHabit(${h.id})">🗑</button></div></div>`}
function addHabit(){const n=$('habitName').value.trim();if(!n)return;S.habits.push({id:uid(),icon:$('habitIcon').value.trim()||'🐼',name:n,days:{}});sv('habits',S.habits);renderHabit();renderHome()}
function toggleHabit(id){const key=dateISO(today);const h=S.habits.find(x=>x.id===id);if(!h)return;if(!h.days)h.days={};h.days[key]=!h.days[key];sv('habits',S.habits);renderHabit();renderHome()}
function editHabit(id){const h=S.habits.find(x=>x.id===id);if(!h)return;const icon=prompt('İkon:',h.icon||'🐼');if(icon===null)return;const name=prompt('Alışkanlık adı:',h.name);if(name===null)return;h.icon=icon.trim()||h.icon;h.name=name.trim()||h.name;sv('habits',S.habits);renderHabit();renderHome()}
function delHabit(id){if(!confirm('Bu alışkanlık tamamen silinsin mi?'))return;S.habits=S.habits.filter(h=>h.id!==id);sv('habits',S.habits);renderHabit();renderHome()}

function renderTez(){const pct=calcTez();$('page-tez').innerHTML=title('🎓','Yüksek Lisans Tezi')+`<div class="card soft center"><div class="statnum">${pct}%</div><div class="statlbl">tez ilerlemesi</div><div class="prog"><div class="bar" style="width:${pct}%"></div></div></div><div class="card"><div class="ct">Aşamalar</div><div class="grid2">${S.tezPhases.map((p,i)=>`<div class="item" style="display:block;cursor:pointer" onclick="editTezPhase(${i})"><div class="it-title">${esc(p.name)}</div><div class="it-sub">${p.pct}% tamamlandı</div><div class="prog"><div class="bar" style="width:${p.pct}%"></div></div></div>`).join('')}</div></div><div class="card"><div class="ct">Danışman notları</div><textarea id="tezNote" placeholder="toplantı notları, sorular, fikirler..." oninput="svs('tezNote',this.value)">${esc(ss('tezNote',''))}</textarea></div><div class="card"><div class="ct">Önemli tarihler</div><div class="row"><input class="inp" id="tdName" placeholder="örn: ara sunum"><input type="date" class="inp" id="tdDate"><button class="btn" onclick="addTezDate()">+ Ekle</button></div><div id="tezDateList">${S.tezDates.map(d=>`<div class="item"><div class="it-main"><div class="it-title">🎓 ${esc(d.name)} ${dueTag(d.date)}</div><div class="it-sub">${d.date?new Date(d.date+'T12:00').toLocaleDateString('tr-TR'):''}</div></div><div class="actions"><button class="btn small ghost" onclick="editTezDate(${d.id})">✎</button><button class="btn small bad" onclick="delTezDate(${d.id})">🗑</button></div></div>`).join('')||'<div class="empty">tez tarihi yok</div>'}</div></div>`}
function editTezPhase(i){const v=prompt(`${S.tezPhases[i].name} yüzde kaç tamamlandı?`,S.tezPhases[i].pct);if(v===null)return;S.tezPhases[i].pct=Math.max(0,Math.min(100,parseInt(v)||0));sv('tezPhases',S.tezPhases);renderTez();renderHome()}
function addTezDate(){const n=$('tdName').value.trim(),d=$('tdDate').value;if(!n||!d)return;S.tezDates.push({id:uid(),name:n,date:d});sv('tezDates',S.tezDates);renderAll()}
function editTezDate(id){const x=S.tezDates.find(t=>t.id===id);if(!x)return;const n=prompt('Ad:',x.name);if(n===null)return;const d=prompt('Tarih:',x.date);if(d===null)return;x.name=n.trim()||x.name;x.date=d.trim()||x.date;sv('tezDates',S.tezDates);renderAll()}
function delTezDate(id){if(!confirm('Bu tez tarihi silinsin mi?'))return;S.tezDates=S.tezDates.filter(t=>t.id!==id);sv('tezDates',S.tezDates);renderAll()}

let pendingFoto='';
function renderFoto(){$('page-foto').innerHTML=title('📸','Anılarım')+`<div class="card soft"><div class="ct">Anı ekle</div><input type="file" id="fotoFile" accept="image/*" style="display:none" onchange="handleFoto(event)"><button class="btn" onclick="$('fotoFile').click()">📷 Fotoğraf seç</button><input class="inp" id="fotoNote" placeholder="bu an için bir not..." style="margin-top:9px"><button class="btn ghost" style="margin-top:9px" onclick="addFoto()">Ekle</button></div><div class="card"><div class="ct">Anılarım (${S.foto.length})</div><div class="foto-grid">${S.foto.map(f=>`<div class="photo"><button class="btn small bad del" onclick="delFoto(${f.id})">🗑</button><img src="${esc(f.data)}" alt="anı"><p>${esc(f.note||'♡')}</p></div>`).join('')}</div>${!S.foto.length?'<div class="empty">henüz anı yok</div>':''}</div>`}
function handleFoto(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{pendingFoto=r.result;alert('Fotoğraf seçildi, şimdi not yazıp Ekle’ye basabilirsin.');};r.readAsDataURL(file)}
function addFoto(){if(!pendingFoto){alert('Önce fotoğraf seç.');return}S.foto.push({id:uid(),data:pendingFoto,note:$('fotoNote').value.trim()||'♡'});pendingFoto='';sv('foto',S.foto);renderFoto()}
function delFoto(id){if(!confirm('Bu anı silinsin mi?'))return;S.foto=S.foto.filter(f=>f.id!==id);sv('foto',S.foto);renderFoto()}

function renderMuzik(){const sp=ss('spotify',''),yt=ss('youtube','');$('page-muzik').innerHTML=title('🎵','Müzik')+`<div class="card soft center"><div style="font-size:3rem">🐼 🎧 🌸</div><div class="title" style="justify-content:center;margin-bottom:4px">Ayşenaz'ın Çalışma Playlistleri</div><div class="subtitle" style="text-align:center;margin:0 0 12px">Hazır listeler direkt YouTube aramasına bağlanır; kendi linkini de kaydedebilirsin.</div><div class="actions" style="justify-content:center">${sp?`<a class="btn ok" href="${esc(sp)}" target="_blank" rel="noopener">Spotify Aç</a>`:''}${yt?`<a class="btn bad" href="${esc(yt)}" target="_blank" rel="noopener">Kaydettiğim YouTube'u Aç</a>`:''}<a class="btn ghost" href="${ytSearch('cute pastel lofi study playlist')}" target="_blank" rel="noopener">🌸 Soft Lofi Aç</a></div></div><div class="card"><div class="ct">Hazır YouTube çalma listeleri</div><div class="grid2">${readyPlaylists.map(p=>`<a class="item" style="text-decoration:none;color:inherit;align-items:flex-start" href="${ytSearch(p[1])}" target="_blank" rel="noopener"><div class="habit-emoji">${p[0].split(' ')[0]}</div><div class="it-main"><div class="it-title">${p[0]}</div><div class="it-sub">${p[2]}</div><div class="tag" style="margin-left:0;margin-top:7px">YouTube’da aç ↗</div></div></a>`).join('')}</div></div><div class="card"><div class="ct">Kendi YouTube playlist linkin</div><div class="row"><input class="inp" id="yt" placeholder="YouTube playlist link..." value="${esc(yt)}"><button class="btn" onclick="svs('youtube',$('yt').value);renderMuzik()">💾 Kaydet</button></div></div><div class="card"><div class="ct">Spotify playlist linkin</div><div class="row"><input class="inp" id="spot" placeholder="Spotify link..." value="${esc(sp)}"><button class="btn" onclick="svs('spotify',$('spot').value);renderMuzik()">💾 Kaydet</button></div></div>`}
function renderMood(){const labels=['','berbat','kötü','orta','iyi','harika'],em=['','😞','😔','😐','🙂','😄'];const cur=S.mood.find(m=>m.date===todayKey);$('page-mood').innerHTML=title('🌿','Mood Tracker')+`<div class="card soft"><div class="ct">Bugün nasıl hissediyorsun?</div><div class="mood-row">${[1,2,3,4,5].map(v=>`<button class="mood-btn ${cur&&cur.val===v?'on':''}" onclick="setMood(${v})">${em[v]}<div class="it-sub">${labels[v]}</div></button>`).join('')}</div></div><div class="card"><div class="ct">Son 7 gün</div><div class="bars">${last7().map(d=>{const m=S.mood.find(x=>x.date===d.key);const h=m?m.val*18:4;return `<div class="bw"><div class="b" style="height:${h}px"></div><div class="bd">${d.label}</div></div>`}).join('')}</div></div>`}
function last7(){const arr=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(today.getDate()-i);arr.push({key:d.toDateString(),label:TR_DAYS[d.getDay()].slice(0,2)})}return arr}
function setMood(v){let m=S.mood.find(x=>x.date===todayKey);if(!m){m={id:uid(),date:todayKey,val:v};S.mood.push(m)}else m.val=v;sv('mood',S.mood);renderMood();renderHome()}
function renderJournal(){const todayISO=dateISO(today);const existing=S.journal.find(j=>j.date===todayISO);$('page-journal').innerHTML=title('✍️','Günlüğüm')+`<div class="card soft"><div class="ct">${today.getDate()} ${TR_MONTHS[today.getMonth()]} ${today.getFullYear()}</div><textarea id="jText" placeholder="bugün nasıldı?">${esc(existing?existing.text:'')}</textarea><button class="btn" style="margin-top:10px" onclick="saveJournal()">Kaydet ♡</button></div><div class="card"><div class="ct">Geçmiş yazılar</div>${S.journal.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(j=>`<div class="item"><div class="it-main"><div class="date-mini">${esc(j.date)}</div><div class="it-sub" style="white-space:pre-wrap;color:var(--tx)">${esc(j.text)}</div></div><button class="btn small bad" onclick="delJournal(${j.id})">🗑</button></div>`).join('')||'<div class="empty">henüz günlük yok</div>'}</div>`}
function saveJournal(){const text=$('jText').value.trim(),d=dateISO(today);let j=S.journal.find(x=>x.date===d);if(!text){alert('Boş günlük kaydedilmedi.');return}if(!j){S.journal.push({id:uid(),date:d,text})}else j.text=text;sv('journal',S.journal);renderJournal()}
function delJournal(id){if(!confirm('Bu günlük yazısı silinsin mi?'))return;S.journal=S.journal.filter(j=>j.id!==id);sv('journal',S.journal);renderJournal()}
function renderTema(){const cur=ss('appIcon','panda');const iconNames=[['panda','🌿 Yumuşak'],['flower','🌸 Çiçek'],['book','📚 Kitap'],['star','⭐ Yıldız'],['moon','🌙 Ay']];$('page-tema').innerHTML=title('🎨','Tema Ayarları')+`<div class="card"><div class="ct">Renk teması</div><div class="theme-grid">${[['floral','Çiçek Pastel','#fff1f7','#d46a7a','#eef8ef'],['panda','Soft Krem','#eef3ec','#7776b9','#fae7eb'],['pink','Pembe','#fce7f3','#be185d','#ede9fe'],['mint','Mint','#d1fae5','#047857','#ecfdf5'],['sky','Mavi','#dbeafe','#1d4ed8','#eff6ff']].map(t=>`<button class="theme ${ss('theme','floral')===t[0]?'active':''}" onclick="setTheme('${t[0]}')"><div class="sw"><span style="background:${t[2]}"></span><span style="background:${t[3]}"></span><span style="background:${t[4]}"></span></div><b>${t[1]}</b></button>`).join('')}</div></div><div class="card"><div class="ct">Uygulama ikonu</div><div class="theme-grid">${iconNames.map(i=>`<button class="theme ${cur===i[0]?'active':''}" onclick="pickAppIcon('${i[0]}')"><div class="icon-choice">${APP_ICONS[i[0]]}</div><b>${i[1]}</b></button>`).join('')}<button class="theme ${cur==='custom'?'active':''}" onclick="$('hiddenIconImport').click()"><div class="icon-choice">📷</div><b>Kendi ikonun</b></button></div><div class="it-sub" style="margin-top:10px">Not: Tarayıcı sekme ikonunu ve uygulama üstündeki ikonu değiştirir. Telefonda ana ekrana eklediysen yeni ikon için kısayolu yeniden eklemek gerekebilir.</div></div><div class="card"><div class="ct">Yazı boyutu</div><div class="actions"><button class="btn ghost" onclick="setFS(0)">A küçük</button><button class="btn ghost" onclick="setFS(1)">A normal</button><button class="btn ghost" onclick="setFS(2)">A büyük</button></div></div><div class="card soft"><div class="ct">Veri yönetimi</div><div class="grid2"><button class="btn ghost" onclick="exportBackup()">⬇️ Yedek indir</button><button class="btn ghost" onclick="$('hiddenImport').click()">⬆️ Yedekten yükle</button><button class="btn bad" onclick="resetData()">🗑 Tüm verileri sıfırla</button><button class="btn ghost" onclick="alert('Bu tek HTML dosyasıdır. GitHub Pages’te ana sayfa olması için dosya adını index.html yapıp yüklemen yeterli.')">ℹ️ Kullanım notu</button></div></div>`}
function applyTheme(t){document.body.dataset.theme=t;svs('theme',t)}function setTheme(t){svs('themeUserPicked','1');applyTheme(t);renderTema()}function applyFS(i){document.documentElement.style.setProperty('--font',i===0?'14px':i===2?'18px':'16px');svs('fs',String(i))}function setFS(i){applyFS(i)}
function exportBackup(){const data={version:'aysenaz-pastel-plus-tek-dosya',date:new Date().toISOString(),localStorage:{}};Object.keys(localStorage).forEach(k=>data.localStorage[k]=localStorage.getItem(k));const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aysenaz-yedek.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);const store=data.localStorage||data;Object.entries(store).forEach(([k,v])=>localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v)));alert('Yedek yüklendi. Sayfa yenileniyor.');location.reload()}catch(err){alert('Yedek dosyası okunamadı.')}};r.readAsText(file)}
function resetData(){if(!confirm('Tüm uygulama verileri silinsin mi? Bu işlem geri alınamaz.'))return;localStorage.clear();location.reload()}
function requestNotif(){if(!('Notification' in window)){alert('Bu tarayıcı bildirim desteklemiyor.');return}Notification.requestPermission().then(p=>alert(p==='granted'?'Bildirim izni açıldı.':'Bildirim izni verilmedi.'))}
function notify(t,b){if('Notification' in window&&Notification.permission==='granted')new Notification(t,{body:b});else alert(t+'\n'+b)}
init();
</script>
