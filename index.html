<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fff1f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ayşenaz">
<title>Ayşenaz</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
:root{
  --bg:#fff7fb; --card:#ffffff; --soft:#fff0f6; --soft2:#f2eeff; --soft3:#eefbf4;
  --text:#433244; --muted:#8b748f; --main:#e879b6; --main2:#a78bfa; --green:#79c99e;
  --yellow:#ffe8a6; --red:#ff8d8d; --border:#f2d6e7; --shadow:0 16px 42px rgba(184,124,172,.18);
}
[data-theme="lavanta"]{--bg:#f8f4ff;--soft:#f0e9ff;--soft2:#fff1f7;--main:#8b5cf6;--main2:#f472b6;--border:#ded2ff}
[data-theme="mint"]{--bg:#f5fff9;--soft:#e8fff2;--soft2:#fff8e8;--main:#43b883;--main2:#7dd3fc;--border:#cdebd9}
[data-theme="peach"]{--bg:#fff8f0;--soft:#fff0df;--soft2:#fff3f8;--main:#fb923c;--main2:#f472b6;--border:#ffd8b6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,var(--bg),#fff);color:var(--text);min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:14px 14px 92px}
.header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg),rgba(255,255,255,.78));backdrop-filter:blur(14px);padding:10px 0 8px}
.hero{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.72);border:1px solid var(--border);border-radius:28px;padding:12px;box-shadow:var(--shadow)}
.logo{width:54px;height:54px;border-radius:19px;background:linear-gradient(135deg,var(--soft),var(--soft2));display:grid;place-items:center;font-size:31px;border:1px solid var(--border)}
.hero h1{font-size:21px;line-height:1.1}.hero p{font-size:12px;color:var(--muted);margin-top:4px}
.nav{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav button{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:999px;padding:10px 12px;white-space:nowrap;box-shadow:0 7px 16px rgba(190,140,180,.10);font-weight:700}
.nav button.active{background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;border-color:transparent}
.page{display:none}.page.active{display:block;animation:pop .18s ease}@keyframes pop{from{opacity:.4;transform:translateY(6px)}to{opacity:1}}
.grid{display:grid;gap:12px}.card{background:rgba(255,255,255,.88);border:1px solid var(--border);border-radius:24px;padding:15px;box-shadow:var(--shadow)}
.title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.title h2{font-size:18px}.sub{font-size:12px;color:var(--muted);line-height:1.45}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.space{justify-content:space-between}
input,textarea,select{width:100%;border:1px solid var(--border);background:#fff;border-radius:16px;padding:12px;color:var(--text);font-size:15px;outline:none}
textarea{min-height:78px;resize:vertical}
button{border:0;border-radius:16px;padding:11px 13px;font-weight:800;cursor:pointer;color:var(--text);background:var(--soft)}
.btn{background:linear-gradient(135deg,var(--main),var(--main2));color:white}.ghost{background:#fff;border:1px solid var(--border)}.danger{background:#fff1f1;color:#b42323;border:1px solid #ffd0d0}.ok{background:#e9fff3;color:#1f7a4d;border:1px solid #caefda}
.small{font-size:12px;padding:8px 10px;border-radius:13px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;background:var(--soft);font-size:12px;font-weight:800;color:var(--muted)}
.item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:linear-gradient(135deg,#fff,var(--soft));border:1px solid var(--border);border-radius:20px;padding:12px;margin:8px 0}
.item.done .name{text-decoration:line-through;color:var(--muted)}.item .name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}.actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:18px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--border);border-radius:20px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:linear-gradient(135deg,var(--soft),#fff);border:1px solid var(--border);border-radius:18px;padding:12px;text-align:center}.kpi b{font-size:20px;display:block}
.archive{margin-top:12px}.archive summary{cursor:pointer;font-weight:900;color:var(--muted);padding:8px}
.timer{font-size:54px;text-align:center;font-weight:900;letter-spacing:-2px;margin:10px 0;color:var(--main)}
.progress{height:12px;background:var(--soft);border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--main),var(--main2));width:0%}
.photo{width:100%;max-height:230px;object-fit:cover;border-radius:18px;border:1px solid var(--border)}
.badge-red{background:#fff1f1;color:#b42323}.badge-green{background:#e9fff3;color:#1f7a4d}.badge-yellow{background:#fff8df;color:#986900}
.footer{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(255,255,255,.74);backdrop-filter:blur(14px);border-top:1px solid var(--border)}
.footer-inner{max-width:520px;margin:0 auto;display:flex;gap:8px}.footer button{flex:1}
@media(max-width:420px){.kpis{grid-template-columns:1fr 1fr}.timer{font-size:45px}.hero h1{font-size:19px}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="hero">
      <div class="logo" id="appEmoji">🐱</div>
      <div style="flex:1"><h1>Ayşenaz</h1><p id="todayLine">Tatlı ama ciddi takip uygulaması</p></div>
      <button class="ghost small" onclick="askNotification()">🔔</button>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>

  <section id="home" class="page active"></section>
  <section id="goals" class="page"></section>
  <section id="courses" class="page"></section>
  <section id="exams" class="page"></section>
  <section id="articles" class="page"></section>
  <section id="watch" class="page"></section>
  <section id="calendar" class="page"></section>
  <section id="clients" class="page"></section>
  <section id="pomodoro" class="page"></section>
  <section id="health" class="page"></section>
  <section id="thesis" class="page"></section>
  <section id="memories" class="page"></section>
  <section id="backup" class="page"></section>
</div>
<div class="footer"><div class="footer-inner"><button class="ghost" onclick="go('home')">🏡 Ana</button><button class="btn" onclick="go('backup')">🛟 Yedek</button></div></div>

<script>
const $=id=>document.getElementById(id);
const qs=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>new Date().toISOString().slice(0,10);
const nowLocal=()=>new Date().toISOString();
const dateTR=d=>d?new Date(d+'T00:00').toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric'}):'Tarihsiz';
const dateTimeTR=d=>d?new Date(d).toLocaleString('tr-TR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'Tarihsiz';
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

const tabs=[
 ['home','🏡 Ana'],['goals','🎯 Hedef'],['courses','📚 Ders'],['exams','📋 Sınav'],['articles','📰 Makale'],['watch','🎬 İzle/Oku'],
 ['calendar','📆 Takvim'],['clients','🩺 Danışan'],['pomodoro','🍅 Pomodoro'],['health','🌿 Sağlık'],['thesis','🎓 Tez'],['memories','💌 Bizim Köşe'],['backup','🛟 Yedek']
];

let S=load('aysenaz_full_state',null)||{
 theme:'pembe', icon:'🐱',
 goals:[], courses:[], exams:[], articles:[], watch:[], events:[], clients:[], health:[], thesis:[], memories:[],
 pomo:{work:25,short:5,long:15,sessions:0,total:0,lastDate:todayISO()},
 settings:{notify:true}
};
function normalize(){
 ['goals','courses','exams','articles','watch','events','clients','health','thesis','memories'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
 S.pomo=S.pomo||{work:25,short:5,long:15,sessions:0,total:0,lastDate:todayISO()};
 S.settings=S.settings||{notify:true};
}
normalize();

function persist(reason='kayıt'){
 normalize();
 save('aysenaz_full_state',S);
 const meta={lastSave:nowLocal(),reason,count:countAll()};
 save('aysenaz_save_meta',meta);
 makeSnapshot(reason);
 renderBackupMini();
}
let snapshotLock=false;
function makeSnapshot(reason){
 if(snapshotLock) return;
 snapshotLock=true;
 setTimeout(()=>snapshotLock=false,900);
 let snaps=load('aysenaz_snapshots',[]);
 snaps.unshift({at:nowLocal(),reason,state:S});
 snaps=snaps.slice(0,8);
 save('aysenaz_snapshots',snaps);
}
function countAll(){return ['goals','courses','exams','articles','watch','events','clients','health','thesis','memories'].reduce((a,k)=>a+S[k].length,0)}
function doneCount(){return ['goals','courses','exams','articles','watch'].reduce((a,k)=>a+S[k].filter(x=>x.done).length,0)}
function byDue(arr){return [...arr].sort((a,b)=>(a.date||a.when||'').localeCompare(b.date||b.when||''))}
function isSoonDate(d,days=2){
 if(!d) return false; const t=new Date(d.includes('T')?d:d+'T23:59').getTime(); const n=Date.now();
 return t>=n && t-n<=days*86400000;
}

function init(){
 $('nav').innerHTML=tabs.map(([id,label])=>`<button onclick="go('${id}')" id="tab-${id}">${label}</button>`).join('');
 const dt=new Date(); $('todayLine').textContent=dt.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
 applyTheme(); renderAll(); go('home'); reminderCheck();
 setInterval(reminderCheck,60000);
}
function go(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 $(id).classList.add('active');
 document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
 const t=$('tab-'+id); if(t)t.classList.add('active');
 if(id==='backup') renderBackup();
}
function applyTheme(){document.documentElement.dataset.theme=S.theme==='pembe'?'':S.theme; $('appEmoji').textContent=S.icon||'🐱'}

function renderAll(){renderHome();renderGoals();renderCourses();renderExams();renderArticles();renderWatch();renderCalendar();renderClients();renderPomodoro();renderHealth();renderThesis();renderMemories();renderBackup();}
function header(icon,title,sub=''){return `<div class="title"><div><h2>${icon} ${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div></div>`}
function empty(t){return `<div class="empty">${t}</div>`}
function archiveBlock(key,label,renderFn){
 const done=S[key].filter(x=>x.done);
 return `<details class="archive"><summary>✅ ${label} arşivi (${done.length})</summary>${done.length?done.map(renderFn).join(''):empty('Henüz arşivde kayıt yok.')}</details>`;
}
function item(x,main,meta,actions='',doneClass=true){
 return `<div class="item ${doneClass&&x.done?'done':''}"><div style="flex:1"><div class="name">${main}</div>${meta?`<div class="meta">${meta}</div>`:''}</div><div class="actions">${actions}</div></div>`;
}
function del(key,id){ if(confirm('Silinsin mi?')){S[key]=S[key].filter(x=>x.id!==id); persist('silme'); renderAll();}}
function toggleDone(key,id){const x=S[key].find(i=>i.id===id); if(x){x.done=!x.done;x.completedAt=x.done?nowLocal():'';persist('tamamlama');renderAll();}}

function addSimple(key,fields){
 const obj={id:uid(),createdAt:nowLocal(),done:false,...fields};
 S[key].push(obj); persist('ekleme'); renderAll();
}

function renderHome(){
 const upcoming=[...S.exams.map(x=>({...x,kind:'Sınav/Ödev'})),...S.events.map(x=>({...x,kind:'Takvim',date:x.when?.slice(0,10)||x.date})),...S.clients.map(x=>({...x,kind:'Randevu',date:x.when?.slice(0,10)||x.date}))].filter(x=>!x.done && isSoonDate(x.when||x.date,3)).slice(0,5);
 $('home').innerHTML=`<div class="grid">
  <div class="card">${header(S.icon||'🐱','Merhaba','Bugün kaybolmayan, yedeklenen ve tatlı görünen bir plan alanın var.')}
    <div class="kpis"><div class="kpi"><b>${countAll()}</b><span class="sub">toplam kayıt</span></div><div class="kpi"><b>${doneCount()}</b><span class="sub">tamamlanan</span></div><div class="kpi"><b>${S.pomo.sessions||0}</b><span class="sub">pomodoro</span></div></div>
  </div>
  <div class="card">${header('⏰','Yaklaşanlar','3 gün içinde görünen sınav, etkinlik ve randevular')}
    ${upcoming.length?upcoming.map(x=>item(x,`${esc(x.kind)} · ${esc(x.name||x.title||x.client)}`,`${dateTimeTR(x.when)||dateTR(x.date)} ${x.note?' · '+esc(x.note):''}`,'',false)).join(''):empty('Yaklaşan kayıt yok.')}
  </div>
  <div class="card">${header('🛟','Kayıt güvencesi','Her ekleme/silme/tamamlama sonrası otomatik kayıt alınır.')}<div id="backupMini"></div></div>
 </div>`;
 renderBackupMini();
}

function renderGoals(){
 const active=S.goals.filter(x=>!x.done), done=S.goals.filter(x=>x.done);
 $('goals').innerHTML=`<div class="card">${header('🎯','Haftalık Hedefler','Tamamlanınca üstü çizilir ve arşive iner.')}
 <div class="row wrap"><input id="goalName" placeholder="Hedef"><input id="goalDate" type="date"><select id="goalPri"><option>Normal</option><option>Acil</option><option>Düşük</option></select><button class="btn" onclick="addGoal()">Ekle</button></div>
 ${active.length?active.map(renderGoal).join(''):empty('Aktif hedef yok.')}
 ${archiveBlock('goals','Tamamlanan hedefler',renderGoal)}
 </div>`;
}
function addGoal(){const n=$('goalName').value.trim(); if(!n)return; addSimple('goals',{name:n,date:$('goalDate').value,priority:$('goalPri').value});}
function renderGoal(x){return item(x,esc(x.name),`${x.priority||'Normal'} ${x.date?' · '+dateTR(x.date):''}`,`<button class="ok small" onclick="toggleDone('goals','${x.id}')">✓</button><button class="danger small" onclick="del('goals','${x.id}')">🗑️</button>`);}

function renderCourses(){
 const active=S.courses.filter(x=>!x.done);
 $('courses').innerHTML=`<div class="card">${header('📚','Dersler','Dersleri tamamlandı yapabilir, arşivde tutabilir veya silebilirsin.')}
 <div class="row wrap"><input id="courseName" placeholder="Ders adı"><input id="courseNote" placeholder="Not / hoca / kaynak"><button class="btn" onclick="addCourse()">Ekle</button></div>
 ${active.length?active.map(renderCourse).join(''):empty('Ders yok.')}
 ${archiveBlock('courses','Tamamlanan dersler',renderCourse)}
 </div>`;
}
function addCourse(){const n=$('courseName').value.trim(); if(!n)return; addSimple('courses',{name:n,note:$('courseNote').value.trim()});}
function renderCourse(x){return item(x,esc(x.name),esc(x.note||''),`<button class="ok small" onclick="toggleDone('courses','${x.id}')">✓</button><button class="danger small" onclick="del('courses','${x.id}')">🗑️</button>`);}

function renderExams(){
 const active=byDue(S.exams.filter(x=>!x.done));
 $('exams').innerHTML=`<div class="card">${header('📋','Sınavlar & Ödevler','Deadline yaklaşınca ana sayfada görünür.')}
 <div class="row wrap"><input id="examName" placeholder="Başlık"><input id="examDate" type="date"><select id="examType"><option>Sınav</option><option>Ödev</option><option>Sunum</option></select><button class="btn" onclick="addExam()">Ekle</button></div>
 ${active.length?active.map(renderExam).join(''):empty('Aktif sınav/ödev yok.')}
 ${archiveBlock('exams','Tamamlanan sınav/ödevler',renderExam)}
 </div>`;
}
function addExam(){const n=$('examName').value.trim(); if(!n)return; addSimple('exams',{name:n,date:$('examDate').value,type:$('examType').value});}
function renderExam(x){return item(x,`${esc(x.type)} · ${esc(x.name)}`,`${x.date?dateTR(x.date):'Tarih yok'} ${isSoonDate(x.date,2)?' · Yaklaşıyor':''}`,`<button class="ok small" onclick="toggleDone('exams','${x.id}')">✓</button><button class="danger small" onclick="del('exams','${x.id}')">🗑️</button>`);}

function renderArticles(){
 const active=S.articles.filter(x=>!x.done);
 $('articles').innerHTML=`<div class="card">${header('📰','Makaleler','Okundu yapılınca arşive iner.')}
 <div class="row wrap"><input id="artName" placeholder="Makale adı"><input id="artUrl" placeholder="Link / DOI"><input id="artNote" placeholder="Kısa not"><button class="btn" onclick="addArticle()">Ekle</button></div>
 ${active.length?active.map(renderArticle).join(''):empty('Makale yok.')}
 ${archiveBlock('articles','Okunan makaleler',renderArticle)}
 </div>`;
}
function addArticle(){const n=$('artName').value.trim(); if(!n)return; addSimple('articles',{name:n,url:$('artUrl').value.trim(),note:$('artNote').value.trim()});}
function renderArticle(x){return item(x,esc(x.name),`${x.url?`<a href="${esc(x.url)}" target="_blank">Link</a> · `:''}${esc(x.note||'')}`,`<button class="ok small" onclick="toggleDone('articles','${x.id}')">Okundu</button><button class="danger small" onclick="del('articles','${x.id}')">🗑️</button>`);}

function renderWatch(){
 const active=S.watch.filter(x=>!x.done);
 $('watch').innerHTML=`<div class="card">${header('🎬','İzle / Oku','Film, dizi, kitap, video listesi.')}
 <div class="row wrap"><input id="watchName" placeholder="Adı"><select id="watchType"><option>Kitap</option><option>Film</option><option>Dizi</option><option>YouTube</option></select><button class="btn" onclick="addWatch()">Ekle</button></div>
 ${active.length?active.map(renderWatchItem).join(''):empty('Liste boş.')}
 ${archiveBlock('watch','Tamamlanan izle/oku',renderWatchItem)}
 </div>`;
}
function addWatch(){const n=$('watchName').value.trim(); if(!n)return; addSimple('watch',{name:n,type:$('watchType').value});}
function renderWatchItem(x){return item(x,`${esc(x.type)} · ${esc(x.name)}`,'',`<button class="ok small" onclick="toggleDone('watch','${x.id}')">✓</button><button class="danger small" onclick="del('watch','${x.id}')">🗑️</button>`);}

function renderCalendar(){
 const arr=byDue(S.events);
 $('calendar').innerHTML=`<div class="card">${header('📆','Takvim Etkinlikleri','Uygulama açıldığında yaklaşan etkinlikleri hatırlatır.')}
 <div class="row wrap"><input id="evName" placeholder="Etkinlik"><input id="evWhen" type="datetime-local"><input id="evNote" placeholder="Not"><button class="btn" onclick="addEvent()">Ekle</button></div>
 ${arr.length?arr.map(renderEvent).join(''):empty('Etkinlik yok.')}
 </div>`;
}
function addEvent(){const n=$('evName').value.trim(); if(!n)return; addSimple('events',{name:n,when:$('evWhen').value,note:$('evNote').value.trim()});}
function renderEvent(x){return item(x,esc(x.name),`${dateTimeTR(x.when)} ${x.note?' · '+esc(x.note):''}`,`<button class="danger small" onclick="del('events','${x.id}')">🗑️</button>`,false);}

function renderClients(){
 const arr=byDue(S.clients.map(x=>({...x,date:x.when?.slice(0,10)||''})));
 $('clients').innerHTML=`<div class="card">${header('🩺','Hasta / Danışan Takip','Randevu, seans notu ve durum takibi.')}
 <div class="row wrap"><input id="clName" placeholder="Danışan adı"><input id="clWhen" type="datetime-local"><select id="clStatus"><option>Planlandı</option><option>Geldi</option><option>Gelmedi</option><option>Tamamlandı</option></select><textarea id="clNote" placeholder="Seans notu / hedef / dikkat edilecekler"></textarea><button class="btn" onclick="addClient()">Randevu ekle</button></div>
 ${arr.length?arr.map(renderClient).join(''):empty('Danışan/randevu kaydı yok.')}
 </div>`;
}
function addClient(){const n=$('clName').value.trim(); if(!n)return; addSimple('clients',{client:n,when:$('clWhen').value,status:$('clStatus').value,note:$('clNote').value.trim()});}
function renderClient(x){return item(x,`${esc(x.client)} · ${esc(x.status||'Planlandı')}`,`${dateTimeTR(x.when)} ${x.note?' · '+esc(x.note):''}`,`<button class="ok small" onclick="clientDone('${x.id}')">✓</button><button class="danger small" onclick="del('clients','${x.id}')">🗑️</button>`,false);}
function clientDone(id){const x=S.clients.find(i=>i.id===id); if(x){x.status='Tamamlandı';x.done=true;persist('danışan tamamlandı');renderAll();}}

let timer=null, mode='work', left=0, total=0, running=false;
function setTimer(){const mins=mode==='work'?S.pomo.work:(mode==='short'?S.pomo.short:S.pomo.long);left=mins*60;total=left;running=false;clearInterval(timer);renderPomodoro();}
function fmt(sec){const m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function startPomo(){if(!left)setTimer();running=true;clearInterval(timer);timer=setInterval(()=>{left--; if(left<=0){clearInterval(timer);running=false;finishPomo()} renderPomodoro();},1000)}
function pausePomo(){running=false;clearInterval(timer);renderPomodoro()}
function finishPomo(){ if(mode==='work'){S.pomo.sessions=(S.pomo.sessions||0)+1;S.pomo.total=(S.pomo.total||0)+1; notify('Pomodoro bitti','Mola zamanı.');} else notify('Mola bitti','Tekrar odak zamanı.'); persist('pomodoro'); renderAll();}
function savePomoSettings(){S.pomo.work=Number($('pWork').value)||25;S.pomo.short=Number($('pShort').value)||5;S.pomo.long=Number($('pLong').value)||15;persist('pomodoro ayarı');setTimer();}
function renderPomodoro(){
 if(!left){const mins=mode==='work'?S.pomo.work:(mode==='short'?S.pomo.short:S.pomo.long);left=mins*60;total=left}
 const pct=total?100-(left/total*100):0;
 $('pomodoro').innerHTML=`<div class="card">${header('🍅','Pomodoro','Süreleri arkadaşın kendi düzenine göre değiştirebilir.')}
 <div class="row wrap"><button class="${mode==='work'?'btn':'ghost'}" onclick="mode='work';setTimer()">Çalışma</button><button class="${mode==='short'?'btn':'ghost'}" onclick="mode='short';setTimer()">Kısa mola</button><button class="${mode==='long'?'btn':'ghost'}" onclick="mode='long';setTimer()">Uzun mola</button></div>
 <div class="timer">${fmt(left)}</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div>
 <div class="row wrap" style="margin-top:12px"><button class="btn" onclick="startPomo()">Başlat</button><button class="ghost" onclick="pausePomo()">Duraklat</button><button class="danger" onclick="setTimer()">Sıfırla</button></div>
 <hr style="border:0;border-top:1px solid var(--border);margin:14px 0">
 <div class="row wrap"><input id="pWork" type="number" min="1" value="${S.pomo.work}" placeholder="Çalışma dk"><input id="pShort" type="number" min="1" value="${S.pomo.short}" placeholder="Kısa mola"><input id="pLong" type="number" min="1" value="${S.pomo.long}" placeholder="Uzun mola"><button class="btn" onclick="savePomoSettings()">Süreleri kaydet</button></div>
 <p class="sub" style="margin-top:10px">Toplam tamamlanan pomodoro: ${S.pomo.total||0}</p>
 </div>`;
}

function renderHealth(){
 $('health').innerHTML=`<div class="card">${header('🌿','Sağlık Takibi','Su, yürüyüş, uyku ve kısa not.')}
 <div class="row wrap"><input id="hWater" type="number" placeholder="Su bardak"><input id="hWalk" type="number" placeholder="Yürüyüş dk"><input id="hSleep" placeholder="Uyku"><input id="hNote" placeholder="Not"><button class="btn" onclick="addHealth()">Kaydet</button></div>
 ${S.health.length?S.health.slice().reverse().map(x=>item(x,`${dateTR(x.date)} · 💧${x.water||0} · 🚶${x.walk||0} dk`,esc(x.sleep||x.note||''),`<button class="danger small" onclick="del('health','${x.id}')">🗑️</button>`,false)).join(''):empty('Sağlık kaydı yok.')}
 </div>`;
}
function addHealth(){addSimple('health',{date:todayISO(),water:Number($('hWater').value||0),walk:Number($('hWalk').value||0),sleep:$('hSleep').value,note:$('hNote').value});}

function renderThesis(){
 $('thesis').innerHTML=`<div class="card">${header('🎓','Tez Takibi','Tarih, görev ve danışman toplantı notları.')}
 <div class="row wrap"><input id="thName" placeholder="Görev / tarih başlığı"><input id="thDate" type="date"><textarea id="thNote" placeholder="Not / aksiyon maddesi"></textarea><button class="btn" onclick="addThesis()">Ekle</button></div>
 ${S.thesis.length?byDue(S.thesis).map(x=>item(x,esc(x.name),`${dateTR(x.date)} ${x.note?' · '+esc(x.note):''}`,`<button class="ok small" onclick="toggleDone('thesis','${x.id}')">✓</button><button class="danger small" onclick="del('thesis','${x.id}')">🗑️</button>`)).join(''):empty('Tez kaydı yok.')}
 </div>`;
}
function addThesis(){const n=$('thName').value.trim(); if(!n)return; addSimple('thesis',{name:n,date:$('thDate').value,note:$('thNote').value.trim()});}

function renderMemories(){
 $('memories').innerHTML=`<div class="card">${header('💌','Bizim Köşemiz','Arkadaşlık anıları, küçük notlar ve güzel şeyler.')}
 <div class="row wrap"><input id="memTitle" placeholder="Başlık"><textarea id="memText" placeholder="Bugünden kalan güzel şey..."></textarea><input id="memPhoto" type="file" accept="image/*"><button class="btn" onclick="addMemory()">Kaydet</button></div>
 ${S.memories.length?S.memories.slice().reverse().map(renderMemory).join(''):empty('Henüz anı yok.')}
 </div>`;
}
function addMemory(){
 const title=$('memTitle').value.trim()||'Küçük anı', text=$('memText').value.trim(), f=$('memPhoto').files[0];
 const finish=data=>addSimple('memories',{title,text,date:todayISO(),photo:data||''});
 if(f){const r=new FileReader(); r.onload=()=>finish(r.result); r.readAsDataURL(f)} else finish('');
}
function renderMemory(x){return item(x,esc(x.title),`${dateTR(x.date)}<br>${x.photo?`<img src="${x.photo}" class="photo" style="margin-top:8px">`:''}<br>${esc(x.text||'')}`,`<button class="danger small" onclick="del('memories','${x.id}')">🗑️</button>`,false);}

function renderBackupMini(){
 const el=$('backupMini'); if(!el) return;
 const meta=load('aysenaz_save_meta',{});
 el.innerHTML=`<p class="sub">Son kayıt: ${meta.lastSave?new Date(meta.lastSave).toLocaleString('tr-TR'):'Henüz yok'} · Sebep: ${esc(meta.reason||'-')}</p>
 <div class="row wrap" style="margin-top:10px"><button class="btn small" onclick="exportBackup()">Yedek indir</button><button class="ghost small" onclick="go('backup')">Yedek merkezi</button></div>`;
}
function renderBackup(){
 const meta=load('aysenaz_save_meta',{}), snaps=load('aysenaz_snapshots',[]);
 $('backup').innerHTML=`<div class="grid">
  <div class="card">${header('🛟','Yedekleme Merkezi','Sadece anılar değil, uygulamadaki her veri dahil edilir.')}
    <div class="kpis"><div class="kpi"><b>${countAll()}</b><span class="sub">kayıt</span></div><div class="kpi"><b>${snaps.length}</b><span class="sub">otomatik kopya</span></div><div class="kpi"><b>${doneCount()}</b><span class="sub">arşiv</span></div></div>
    <p class="sub" style="margin-top:10px">Son otomatik kayıt: ${meta.lastSave?new Date(meta.lastSave).toLocaleString('tr-TR'):'Henüz yok'}</p>
    <div class="row wrap" style="margin-top:12px"><button class="btn" onclick="exportBackup()">Tüm veriyi yedek indir</button><label class="ghost" style="display:inline-block"><input type="file" accept="application/json" onchange="importBackup(event)" style="display:none">Yedekten yükle</label><button class="danger" onclick="resetAll()">Tüm veriyi sıfırla</button></div>
  </div>
  <div class="card">${header('🎨','Tema & ikon','Panda çakılı değil; ikon ve tema değiştirilebilir.')}
    <div class="row wrap"><select id="themeSel"><option value="pembe">Pembe</option><option value="lavanta">Lavanta</option><option value="mint">Mint</option><option value="peach">Şeftali</option></select><select id="iconSel"><option>🐱</option><option>🐢</option><option>🐼</option><option>🐰</option><option>🦊</option><option>🌸</option><option>⭐</option></select><button class="btn" onclick="saveLook()">Kaydet</button></div>
  </div>
  <div class="card">${header('📦','Otomatik kopyalar','Son 8 işlem küçük güvenlik kopyası olarak cihazda tutulur.')}
    ${snaps.length?snaps.map((s,i)=>item(s,`${i+1}. kopya · ${new Date(s.at).toLocaleString('tr-TR')}`,`Sebep: ${esc(s.reason)}`,`<button class="ghost small" onclick="restoreSnapshot(${i})">Geri yükle</button>`,false)).join(''):empty('Henüz otomatik kopya yok.')}
  </div>
 </div>`;
 setTimeout(()=>{if($('themeSel'))$('themeSel').value=S.theme;if($('iconSel'))$('iconSel').value=S.icon},0);
}
function saveLook(){S.theme=$('themeSel').value;S.icon=$('iconSel').value;applyTheme();persist('tema/ikon');renderAll();}
function exportBackup(){
 const pack={app:'Ayşenaz',version:2,exportedAt:nowLocal(),state:S};
 const blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'});
 const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`aysenaz-yedek-${todayISO()}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function importBackup(e){
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{const p=JSON.parse(r.result); if(!p.state)throw new Error('state yok'); S=p.state; normalize(); persist('yedekten yükleme'); applyTheme(); renderAll(); alert('Yedek yüklendi.')}catch(err){alert('Bu dosya uygun bir Ayşenaz yedeği gibi görünmüyor.')}};
 r.readAsText(f);
}
function restoreSnapshot(i){const snaps=load('aysenaz_snapshots',[]); if(!snaps[i])return; if(confirm('Bu otomatik kopyaya dönülsün mü?')){S=snaps[i].state;normalize();persist('otomatik kopyadan dönüş');applyTheme();renderAll();}}
function resetAll(){if(confirm('Tüm veriler silinecek. Önce yedek almanı öneririm. Devam edilsin mi?')){localStorage.removeItem('aysenaz_full_state');location.reload();}}

function notify(title,body){
 if(!S.settings.notify) return;
 try{ if(Notification.permission==='granted') new Notification(title,{body,icon:'./icon-192.png'}); }catch(e){}
}
function askNotification(){ if(!('Notification' in window)){alert('Bu cihaz/tarayıcı bildirim desteklemiyor.');return} Notification.requestPermission().then(p=>alert(p==='granted'?'Bildirim izni verildi.':'Bildirim izni verilmedi.'))}
let lastReminder='';
function reminderCheck(){
 const due=[];
 S.events.forEach(x=>{if(isSoonDate(x.when,1))due.push('Takvim: '+x.name)});
 S.clients.forEach(x=>{if(!x.done && isSoonDate(x.when,1))due.push('Randevu: '+x.client)});
 S.exams.forEach(x=>{if(!x.done && isSoonDate(x.date,1))due.push('Sınav/ödev: '+x.name)});
 const key=due.join('|');
 if(due.length && key!==lastReminder){lastReminder=key; notify('Yaklaşan kayıt var',due.slice(0,3).join(', '));}
}

init();
persist('uygulama açılışı');
</script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script>
</body>
</html>
